  <!DOCTYPE html>
  <html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
      <link rel="stylesheet" href="homepagestyle.css">
      <link rel="icon" type="image/png" href="webtopperlogo.png">
  </head>
  <body class="signup">
    <ul class="navbar">
      <li class="navbar"><a class="navbar" href="homepage.html">Home</a></li>
      <li class="navbar"><a class="navbar" href="account.html">Account</a></li>
      <li class="navbar"><a href="#" class ="navbar" onclick="logout()">Logout</a></li>
    </ul>
  <div class="posts">
    <p class="post">Welcome to my project, if you have any queries or feedback feel free to send me an email at alex.duffield1201@gmail.com</p>
  </div>
  <div class="posts">

    <p  class="posthead">Enter new post:</p>
    <textarea class ="post" maxlength="375" type="text" id="postContent" placeholder="What do you want to post about today? (Max 375 characters)"></textarea><br><br>
    <button class="post" onclick="post()">Post</button>
  </div>
  <div id="feed"></div>

  <script>
  async function logout() {
      await fetch('/logout');
      window.location.href = 'loginpage.html';
    }
async function fetchPosts() {
  try {
    const response = await fetch('/getPosts', { credentials: 'include' });
    const detailResponse = await fetch('/dashboard', { credentials: 'include' });
    const userDetails = await detailResponse.json();

    if (!response.ok) {
      document.getElementById('feed').textContent = 'Error loading posts';
      return;
    }

    const posts = await response.json();
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    posts.forEach(post => {
      const postElement = document.createElement('div');

      // ✅ Prefix "Admin" if the post author has admin permission
      const displayName = post.admin ? `Admin ${post.username}` : post.username;

      let postHTML = `
        <div class="posts">
          <p class="${post.admin ? 'postContentAdmin' : 'postContent'}">
            <strong>${displayName}</strong> (${new Date(post.timestamp).toLocaleString()}):
          </p>
          <p class="postContent">${post.content}</p>
      `;

      // ✅ Show delete if current user is admin OR owns the post
      const canDelete = userDetails.admin || post.username === userDetails.username;
      if (canDelete) {
        postHTML += `<button class="deletepost" onclick="deletePost('${post.postId}')">Delete</button>`;
      }

      postHTML += `</div>`;
      postElement.innerHTML = postHTML;
      feed.appendChild(postElement);
    });
  } catch (error) {
    console.error('Error loading posts:', error);
  }
}
  setInterval(fetchPosts, 1000);
  async function post(){
      const content = document.getElementById("postContent").value;
      const data = { content };

      try {
        const response = await fetch('/submitPost', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data),
          credentials: 'include'
        });

        if (response.ok) {
          alert('Post submitted successfully!');
          document.getElementById("postContent").value = '';
          console.log('Post data submitted:', data);
          fetchPosts();
        } else {
          alert('Error submitting post.');  
        }
      } catch (error) {
        console.error('Error submitting post:', error);
      }

    };
    async function deletePost(postId) {
      try {
        const response = await fetch(`/deletePost/${postId}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (response.ok) {
          alert('Post deleted successfully!');
          fetchPosts();
        } else {
          alert('You can only delete your own posts, button will be updated for user only view in further releases.');
        }
      } catch (error) {
        console.error('Error deleting post:', error);
      }
    }
  fetchPosts();
  </script>
  </body>
  </html>
